---
layout: default
---

{% include nav.html %}
{% include header.html %}

<div class="blur-background">
	<div class="page">
		<aside class="text-center">
			<div class="sidebar-container sticky-top">
				<span class="rounded-card parent-link-card">
					<a href="/articles/{{page.category}}" class="button nier highlight-hover bullet triangle-left">Autres articles</a>
					<a href="#" class="button nier highlight-hover bullet triangle-up top-button">Top</a>
				</span>
				<span class="rounded-card nav-card hidden">
					<div class="sidebar-buttons">
						<a href="#" class="back-button button nier highlight-hover bullet triangle-left">Back</a>
						<a href="#" class="clear-button button nier highlight-hover bullet">Clear</a>
					</div>
					<ul class="history-list"></ul>
				</span>
			</div>
		</aside>
		<section class="gutters">
			<article>
				<h1 class="text-center">{{ page.title }}</h1>
				<div class="text-center"><strong>Sommaire</strong></div>
				{{ content | toc }}
			</article>
		</section>
	</div>
</div>

{% include footer.html %}
